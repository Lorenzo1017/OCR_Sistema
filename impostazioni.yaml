# Impostazioni opzionali di OCR_Sistema.
# Lingue OCR per Tesseract: "ita", oppure "ita+eng" per documenti misti.
# Richiede i language pack installati (es. tesseract-lang via Homebrew).
ocr_lingue: ita

# Salvare una copia degli originali in originali/originali.zip? (true/false)
# false = NON tiene il backup (l'archivio e' gia' la copia catalogata).
backup_originali: false

# Quanti documenti OCR-are in parallelo. 2 = sicuro su 16GB RAM (meno pressione
# su Ollama/Metal). Alza con cautela se hai piu' RAM.
ocr_workers: 2
# categorie archiviate in sottocartelle per anno (dalla data del documento)
categorie_per_anno:
  - Salute/Referti

# Righe da togliere dal testo PRIMA della classificazione (boilerplate ripetuto).
# Regex, una per voce. Il testo completo resta comunque salvato per la ricerca.
# rimuovi_dal_testo:
#   - "Azienda certificata ISO.*"
#   - "Documento generato automaticamente.*"

# App che, se APERTE, mettono in pausa il processamento (es. lo scanner: mentre
# scansiona scrive PDF a meta' in inbox). Il daemon riprende da solo quando le
# chiudi. Nome come l'app in /Applicazioni.
pausa_se_app_attiva:
  - Image Capture      # "Acquisizione Immagine" (scanner integrato macOS)

